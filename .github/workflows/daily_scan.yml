name: NSE Alpha Breakout Daily Scanner

on:
  schedule:
    - cron: '30 15 * * 1-5'  # 15:30 UTC = 21:00 IST (Mon - Fri)
  workflow_dispatch:         # Enables manual 1-click execution from GitHub UI

jobs:
  run-daily-alpha:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Alpha Breakout Pipeline
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python main.py

      - name: Commit & Push Daily Reports & Performance Logs
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add reports/ performance/ data/
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-Update: Daily Alpha Scan $(date +'%Y-%m-%d')"
          git push
